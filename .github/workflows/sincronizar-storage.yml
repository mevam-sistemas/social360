name: Sincronizar arquivos do 360social

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronizar-storage-social360
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOURCE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SOCIAL360_TARGET_URL: ${{ secrets.SOCIAL360_TARGET_URL }}
      SOCIAL360_TARGET_SERVICE_ROLE_KEY: ${{ secrets.SOCIAL360_TARGET_SERVICE_ROLE_KEY }}
      SOCIAL360_TARGET_DB_URL: ${{ secrets.SOCIAL360_TARGET_DB_URL }}

    steps:
      - name: Obter código versionado
        uses: actions/checkout@v4

      - name: Validar configuração protegida
        shell: bash
        run: |
          set -euo pipefail
          required=(SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SOURCE_DB_URL SOCIAL360_TARGET_URL SOCIAL360_TARGET_SERVICE_ROLE_KEY SOCIAL360_TARGET_DB_URL)
          for variable in "${required[@]}"; do
            [[ -n "${!variable:-}" ]] || { echo "Segredo ausente: $variable" >&2; exit 1; }
          done

      - name: Copiar logos e fotos sem alterar dados cadastrais
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/objetos-sociais.tsv"
          psql "$SOURCE_DB_URL" -v ON_ERROR_STOP=1 -At -F $'\t' -c \
            "select bucket_id,name,coalesce(metadata->>'mimetype','') from storage.objects where bucket_id in ('logos-instituicoes','fotos-equipe') order by bucket_id,name" \
            > "$manifest"
          SOCIAL360_OBJECT_MANIFEST="$manifest" python3 scripts/migrate_storage_social.py

      - name: Atualizar URLs públicas que ainda apontam para o projeto anterior
        shell: bash
        run: |
          set -euo pipefail
          psql "$SOCIAL360_TARGET_DB_URL" -v ON_ERROR_STOP=1 \
            --set=source_url="$SUPABASE_URL" --set=target_url="$SOCIAL360_TARGET_URL" <<'SQL'
          update social.instituicoes
             set logo_url = replace(logo_url, :'source_url', :'target_url')
           where logo_url like :'source_url' || '/storage/v1/object/%';
          SQL

      - name: Auditar referências de imagens sem expor dados pessoais
        shell: bash
        run: |
          set -euo pipefail
          psql "$SOCIAL360_TARGET_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          select 'equipe|' || tipo || '|' || count(*) from (select case
            when foto_url is null or btrim(foto_url) = '' then 'vazia'
            when foto_url like 'data:%' then 'data-url'
            when foto_url like 'http%' then 'url-' || split_part(split_part(foto_url, '://', 2), '/', 1)
            else 'caminho-storage'
          end as tipo from social.equipe) dados group by tipo;

          select 'logo|' || tipo || '|' || count(*) from (select case
            when logo_url is null or btrim(logo_url) = '' then 'vazia'
            when logo_url like 'data:%' then 'data-url'
            when logo_url like 'http%' then 'url-' || split_part(split_part(logo_url, '://', 2), '/', 1)
            else 'caminho-storage'
          end as tipo from social.instituicoes) dados group by tipo;
          SQL

          echo "Objetos disponíveis no Storage de origem por bucket:"
          psql "$SOURCE_DB_URL" -v ON_ERROR_STOP=1 -Atc \
            "select bucket_id || '|' || count(*) from storage.objects where bucket_id in ('logos-instituicoes','fotos-equipe','fotos') group by bucket_id order by bucket_id"

      - name: Confirmar objetos copiados
        shell: bash
        run: |
          set -euo pipefail
          psql "$SOCIAL360_TARGET_DB_URL" -v ON_ERROR_STOP=1 -Atc \
            "select foto_url from social.equipe where foto_url is not null and btrim(foto_url) <> '' and foto_url not like 'data:%' and foto_url not like 'http%' limit 3" \
            > "${RUNNER_TEMP}/fotos-equipe.txt"
          psql "$SOCIAL360_TARGET_DB_URL" -v ON_ERROR_STOP=1 -Atc \
            "select logo_url from social.instituicoes where logo_url like 'http%' limit 1" \
            > "${RUNNER_TEMP}/logo-url.txt"
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          base = os.environ["SOCIAL360_TARGET_URL"].rstrip("/")
          key = os.environ["SOCIAL360_TARGET_SERVICE_ROLE_KEY"]
          request = urllib.request.Request(
              f"{base}/storage/v1/bucket",
              headers={"apikey": key, "Authorization": f"Bearer {key}"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              buckets = {item["id"] for item in json.load(response)}
          required = {"logos-instituicoes", "fotos-equipe"}
          missing = required - buckets
          if missing:
              raise SystemExit(f"Buckets ausentes: {', '.join(sorted(missing))}")

          def is_image(payload):
              return (payload.startswith(b"\x89PNG\r\n\x1a\n")
                      or payload.startswith(b"\xff\xd8\xff")
                      or payload[:4] in (b"RIFF", b"GIF8"))

          runner = pathlib.Path(os.environ["RUNNER_TEMP"])
          paths = [line for line in (runner / "fotos-equipe.txt").read_text().splitlines() if line]
          if not paths:
              raise SystemExit("Nenhuma referência de foto da equipe disponível para validação")
          for path in paths:
              url = f"{base}/storage/v1/object/fotos-equipe/{urllib.parse.quote(path, safe='/')}"
              req = urllib.request.Request(url, headers={"apikey": key, "Authorization": f"Bearer {key}"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = response.read(32)
              if not is_image(payload):
                  raise SystemExit("Uma foto copiada não contém bytes de imagem válidos")

          logo_urls = [line for line in (runner / "logo-url.txt").read_text().splitlines() if line]
          if not logo_urls:
              raise SystemExit("Nenhuma logo disponível para validação")
          with urllib.request.urlopen(logo_urls[0], timeout=60) as response:
              logo = response.read(32)
          if not is_image(logo):
              raise SystemExit("A logo publicada não contém bytes de imagem válidos")
          print(f"Logo e {len(paths)} amostras de fotos abriram como imagens válidas.")
          PY
