<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural de Impacto — 360social</title>
<meta name="theme-color" content="#0F0D0A">
<link rel="icon" href="marca/icone-laranja.svg">
<style>
/* ============================================================
   Mural de impacto — feito para ser lido de três metros.
   Um número por vez. Nada de painel apertado com doze gráficos:
   quem passa na recepção tem quatro segundos de atenção, e o que
   fica é um número grande com uma frase humana embaixo.

   Regra que não se quebra: nesta tela não aparece nome, foto nem
   código de ninguém. Números agregados, só. A TV fica num lugar
   público — quem está sendo atendido não escolheu virar cartaz.
   ============================================================ */
:root{
  --lar:#F26A1B; --lar-luz:#FF8A47; --preto:#0F0D0A; --preto2:#17140F;
  --papel:#F8F6F2; --sub:#8E8A82; --ok:#2ED47A; --av:#FFC062;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--preto);color:var(--papel);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 78% 12%,rgba(242,106,27,.20),transparent 58%),
             radial-gradient(ellipse at 12% 88%,rgba(59,111,224,.13),transparent 55%)}

/* ---------- topo ---------- */
.cab{position:relative;z-index:2;display:flex;align-items:center;gap:16px;
  padding:2.6vh 3.4vw;border-bottom:1px solid rgba(255,255,255,.08)}
.cab .inst{display:flex;align-items:center;gap:13px}
.cab .inst svg{width:clamp(28px,2.6vw,44px);height:clamp(28px,2.6vw,44px)}
.cab .inst b{font-size:clamp(16px,1.6vw,26px);font-weight:800;letter-spacing:-.02em}
.cab .sp{flex:1}
.cab .agora{font-size:clamp(13px,1.15vw,19px);color:var(--sub);font-weight:650;
  font-variant-numeric:tabular-nums}
.cab .vivo{display:inline-flex;align-items:center;gap:9px;font-size:clamp(11px,.95vw,15px);
  font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ok)}
.cab .vivo i{width:9px;height:9px;border-radius:50%;background:var(--ok);
  animation:pulsa 2s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(46,212,122,.5)}
  50%{opacity:.65;box-shadow:0 0 0 10px rgba(46,212,122,0)}}

/* ---------- palco ---------- */
.palco{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;
  padding:3vh 5vw}
.slide{position:absolute;inset:3vh 5vw;display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.slide.on{display:flex;animation:entra .7s cubic-bezier(.2,.7,.3,1)}
@keyframes entra{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.rot{font-size:clamp(13px,1.35vw,22px);font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--lar);margin-bottom:2.2vh}
.rot.viva{color:var(--ok);display:inline-flex;align-items:center;gap:11px}
.rot.viva i{width:11px;height:11px;border-radius:50%;background:var(--ok);
  animation:pulsa 2s ease-in-out infinite}
.numero{font-size:clamp(84px,17vw,300px);font-weight:800;letter-spacing:-.05em;line-height:.92;
  background:linear-gradient(160deg,#fff 20%,#FFD0AC);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums}
/* atenção: usar `background-image` e não `background` — a forma curta
   zera o background-clip:text e o número vira um bloco colorido. */
.numero.vivo{background-image:linear-gradient(160deg,#fff 20%,#A8F5CB)}
.frase{font-size:clamp(18px,2.3vw,40px);font-weight:650;letter-spacing:-.022em;
  margin-top:2.4vh;max-width:22ch;line-height:1.25}
.apoio{font-size:clamp(14px,1.25vw,22px);color:var(--sub);margin-top:1.8vh;max-width:40ch;line-height:1.5}

/* dois números lado a lado */
.par{display:flex;gap:clamp(30px,7vw,140px);align-items:flex-start;justify-content:center;flex-wrap:wrap}
.par .un{text-align:center}
.par .un .n{font-size:clamp(56px,10vw,170px);font-weight:800;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums}
.par .un .n.laranja{color:var(--lar-luz)}
.par .un .r{font-size:clamp(13px,1.2vw,20px);color:var(--sub);margin-top:1.4vh;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase}

/* ---------- presença ao vivo: os lugares ---------- */
.lugares{display:flex;gap:clamp(18px,3vw,54px);justify-content:center;flex-wrap:wrap;
  width:min(1200px,90vw);margin-top:2.6vh}
.lug{flex:1 1 clamp(220px,26vw,380px);background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);border-radius:clamp(14px,1.4vw,24px);
  padding:clamp(18px,2.2vh,34px) clamp(18px,1.8vw,32px);text-align:left}
.lug .nm{font-size:clamp(13px,1.15vw,20px);font-weight:750;color:var(--sub);
  letter-spacing:.04em;text-transform:uppercase;line-height:1.3}
.lug .n{font-size:clamp(46px,6.4vw,110px);font-weight:800;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;margin-top:.8vh}
.lug .n span{font-size:clamp(16px,1.5vw,26px);color:var(--sub);font-weight:700;letter-spacing:-.01em}
.lug .tr{height:clamp(9px,1.1vh,16px);background:rgba(255,255,255,.08);border-radius:100px;
  overflow:hidden;margin-top:1.6vh}
.lug .tr i{display:block;height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--lar),var(--lar-luz));
  animation:cresce 1.1s cubic-bezier(.2,.8,.2,1) both}
.lug .tr i.cheio{background:linear-gradient(90deg,#D64430,#FF6A52)}
.lug .pe2{font-size:clamp(12px,1.05vw,18px);color:var(--sub);margin-top:1.2vh;font-weight:650}

/* lista de serviços */
.lista{width:min(1100px,88vw);display:flex;flex-direction:column;gap:clamp(11px,1.5vh,22px);margin-top:1vh}
.li{display:flex;align-items:center;gap:clamp(14px,1.6vw,26px)}
.li .em{width:clamp(38px,4vw,70px);display:flex;align-items:center;justify-content:center;flex:none;color:var(--lar-luz)}
.li .em svg{width:clamp(26px,3vw,52px);height:clamp(26px,3vw,52px)}
.li .nm{font-size:clamp(17px,1.9vw,34px);font-weight:700;letter-spacing:-.02em;
  flex:none;width:clamp(150px,17vw,320px);text-align:left}
.li .tr{flex:1;height:clamp(14px,1.7vh,26px);background:rgba(255,255,255,.07);
  border-radius:100px;overflow:hidden}
.li .tr i{display:block;height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--lar),var(--lar-luz));
  animation:cresce 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes cresce{from{width:0 !important}}
.li .n{font-size:clamp(19px,2.1vw,38px);font-weight:800;width:clamp(64px,5vw,110px);
  text-align:right;flex:none;font-variant-numeric:tabular-nums}

/* gráfico */
.graf{display:flex;align-items:flex-end;gap:clamp(5px,.9vw,16px);
  height:clamp(160px,32vh,340px);width:min(1100px,88vw);margin-top:2vh}
.graf .b{flex:1;border-radius:8px 8px 4px 4px;min-height:5px;
  background:linear-gradient(180deg,var(--lar-luz),var(--lar));
  animation:sobe 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes sobe{from{height:0 !important}}

/* rodapé */
.pe{position:relative;z-index:2;display:flex;align-items:center;gap:14px;
  padding:1.8vh 3.4vw;border-top:1px solid rgba(255,255,255,.08);
  font-size:clamp(11px,1vw,16px);color:var(--sub)}
.pe .sp{flex:1}
.pe .marca{display:inline-flex;align-items:center;gap:9px;font-weight:700;color:#B9B4AB}
.pe .marca svg{width:clamp(16px,1.4vw,24px);height:clamp(16px,1.4vw,24px)}
.pe .marca i{font-style:normal;font-weight:500;color:var(--sub)}
.pe .arbor{opacity:.72}
.pe .arbor b{color:#B9B4AB;font-weight:750;letter-spacing:.01em}
@media(max-width:820px){ .pe .arbor{display:none} }
.pontos{display:flex;gap:8px}
.pontos i{width:clamp(7px,.6vw,11px);height:clamp(7px,.6vw,11px);border-radius:50%;
  background:rgba(255,255,255,.2);transition:.4s}
.pontos i.on{background:var(--lar);width:clamp(22px,2vw,34px);border-radius:100px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s360" viewBox="-60 -60 120 120">
    <path d="M13.46,-50.23 A52,52 0 0 1 50.23,13.46 L38.64,10.35 A40,40 0 0 0 10.35,-38.64 Z M36.77,36.77 A52,52 0 0 1 -36.77,36.77 L-28.28,28.28 A40,40 0 0 0 28.28,28.28 Z M-50.23,13.46 A52,52 0 0 1 -13.46,-50.23 L-10.35,-38.64 A40,40 0 0 0 -38.64,10.35 Z" fill="#F26A1B"/>
    <circle cx="0" cy="0" r="16.64" fill="#F26A1B"/>
  </symbol>
  <!-- Ícones de serviço do mural — trocam os emoji antigos (🍽️🚿✂️🧺👕🤝) por
       um traço fino e monocromático, no mesmo espírito do resto da marca,
       mas ainda grande e reconhecível de longe (é uma TV, não um botão). -->
  <symbol id="i-refeicao" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8z"/><path d="M12 11.5V3.5"/><path d="M8.8 3.5a3.2 3.2 0 0 1 6.4 0"/></g></symbol>
  <symbol id="i-banho" viewBox="0 0 24 24"><path d="M12 2.5S5.5 11 5.5 15.5a6.5 6.5 0 1 0 13 0C18.5 11 12 2.5 12 2.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-tesoura" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.2" cy="6.2" r="2.7"/><circle cx="6.2" cy="17.8" r="2.7"/><path d="M20 4 8.4 15.6"/><path d="M14.7 14.4 20 20"/><path d="M8.4 8.4 12 12"/></g></symbol>
  <symbol id="i-cesta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 10h15.6l-1.6 9.2a2 2 0 0 1-2 1.6H7.8a2 2 0 0 1-2-1.6z"/><path d="M8.2 10 9.3 5h5.4l1.1 5"/><path d="M9 14v3.4M12 14v3.4M15 14v3.4"/></g></symbol>
  <symbol id="i-roupa" viewBox="0 0 24 24"><path d="M8.3 3 4.3 6l1.8 3 2.3-1.4V21h7V7.6L17.7 9l1.8-3-4-3-2.2 2h-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-acolhida" viewBox="0 0 24 24"><path d="M12 20.3S3.8 15.2 3.8 9.6C3.8 6.4 6 4.3 8.8 4.3c1.8 0 3.2 1 4.2 2.5C14 5.3 15.4 4.3 17.2 4.3c2.8 0 5 2.1 5 5.3 0 5.6-8.2 10.7-8.2 10.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
</svg>

<div class="cab">
  <div class="inst"><svg><use href="#s360"/></svg><b id="inst">Instituto Humanitário SOS Vida</b></div>
  <div class="sp"></div>
  <span class="vivo"><i></i> Ao vivo</span>
  <span class="agora" id="agora"></span>
</div>

<div class="palco" id="palco"></div>

<div class="pe">
  <span class="marca"><svg><use href="#s360"/></svg> 360<i>social</i></span>
  <span class="arbor"><b>ARBOR Labs</b> · desenvolvido orgulhosamente no Brasil</span>
  <span class="sp"></span>
  <div class="pontos" id="pontos"></div>
</div>

<script>
/* Números de demonstração, no mesmo formato que o painel vai receber do banco.
   `presenca` é o único bloco que muda a cada minuto — o resto é do dia. */
const DADOS = {
  instituicao: 'Instituto Humanitário SOS Vida',
  presenca: {
    locais: [
      { nome:'Restaurante Comunitário', dentro: 87, capacidade: 120 },
      { nome:'Centro Comunitário',      dentro: 24, capacidade: 80  }
    ]
  },
  hoje:   { pessoas: 142, atendimentos: 218, novos: 9 },
  semana: { pessoas: 638 },
  mes:    { pessoas: 2140, atendimentos: 5384 },
  servicos: [
    { ic:'i-refeicao', nome:'Almoço', n:128 },
    { ic:'i-banho', nome:'Banho', n:64 },
    { ic:'i-tesoura', nome:'Corte de cabelo', n:31 },
    { ic:'i-cesta', nome:'Cesta básica', n:27 },
    { ic:'i-roupa', nome:'Roupas', n:22 },
    { ic:'i-acolhida', nome:'Atendimento social', n:18 }
  ],
  evolucao: [58,74,81,66,92,104,38,29,88,97,84,101,119,142],
  doacoes: { entradas: 52, saidas: 41 }
};

const nf = n => n.toLocaleString('pt-BR');
const totalDentro = () => DADOS.presenca.locais.reduce((s,l) => s + l.dentro, 0);
const totalCap    = () => DADOS.presenca.locais.reduce((s,l) => s + (l.capacidade||0), 0);

const SLIDES = [

  /* ---- AGORA DENTRO — o slide que justifica a TV estar ligada ---- */
  () => {
    const t = totalDentro();
    return `<div class="rot viva"><i></i>Agora dentro</div>
      <div class="numero vivo">${nf(t)}</div>
      <div class="frase">${t === 1 ? 'pessoa está sendo acolhida neste momento'
                                   : 'pessoas estão sendo acolhidas neste momento'}</div>
      <div class="apoio">Contagem em tempo real dos espaços fechados. Ninguém permanece
        aqui sem passar por um operador ou pelo serviço social.</div>`;
  },

  /* ---- o mesmo número, aberto por lugar ---- */
  () => `<div class="rot viva"><i></i>Agora dentro, por espaço</div>
    <div class="lugares">${DADOS.presenca.locais.map(l => {
      const pct = l.capacidade ? Math.min(100, Math.round(l.dentro/l.capacidade*100)) : 0;
      return `<div class="lug">
        <div class="nm">${l.nome}</div>
        <div class="n">${nf(l.dentro)}${l.capacidade?`<span> / ${nf(l.capacidade)}</span>`:''}</div>
        ${l.capacidade?`<div class="tr"><i class="${pct>=90?'cheio':''}" style="width:${pct}%"></i></div>
          <div class="pe2">${pct}% da lotação · ${nf(Math.max(0,l.capacidade-l.dentro))} lugares livres</div>`:''}
      </div>`;
    }).join('')}</div>
    <div class="apoio" style="margin-top:3vh">A capacidade não é enfeite: é o limite que mantém
      o atendimento digno e o espaço seguro.</div>`,

  () => `<div class="rot">Hoje</div>
    <div class="numero">${nf(DADOS.hoje.pessoas)}</div>
    <div class="frase">pessoas receberam alguma forma de cuidado hoje</div>
    <div class="apoio">Cada número aqui é uma pessoa diferente — não a soma de quantas vezes ela voltou.</div>`,

  () => `<div class="rot">Hoje</div>
    <div class="par">
      <div class="un"><div class="n">${nf(DADOS.hoje.pessoas)}</div><div class="r">pessoas</div></div>
      <div class="un"><div class="n laranja">${nf(DADOS.hoje.atendimentos)}</div><div class="r">atendimentos</div></div>
    </div>
    <div class="apoio" style="margin-top:3vh">A mesma pessoa pode almoçar, tomar banho e cortar o cabelo.
      São três atendimentos e uma pessoa — e a gente conta as duas coisas separadas.</div>`,

  () => `<div class="rot">Serviços de hoje</div>
    <div class="lista">${DADOS.servicos.map(s => {
      const max = Math.max(...DADOS.servicos.map(x => x.n));
      return `<div class="li"><span class="em"><svg><use href="#${s.ic}"/></svg></span><span class="nm">${s.nome}</span>
        <span class="tr"><i style="width:${s.n/max*100}%"></i></span>
        <span class="n">${s.n}</span></div>`;
    }).join('')}</div>`,

  () => `<div class="rot">Esta semana</div>
    <div class="numero">${nf(DADOS.semana.pessoas)}</div>
    <div class="frase">pessoas alcançadas nos últimos sete dias</div>`,

  () => `<div class="rot">Neste mês</div>
    <div class="numero">${nf(DADOS.mes.pessoas)}</div>
    <div class="frase">pessoas receberam cuidado através desta organização</div>
    <div class="apoio">${nf(DADOS.mes.atendimentos)} atendimentos realizados no período.</div>`,

  () => {
    const max = Math.max(...DADOS.evolucao);
    return `<div class="rot">Últimos 14 dias</div>
      <div class="graf">${DADOS.evolucao.map(v =>
        `<div class="b" style="height:${Math.max(4, v/max*100)}%"></div>`).join('')}</div>
      <div class="apoio" style="margin-top:3vh">Pessoas diferentes por dia. A linha sobe quando a
        instituição alcança mais gente — não quando entrega mais coisas.
        As quedas são fim de semana, quando o restaurante não abre.</div>`;
  },

  () => `<div class="rot">Doações</div>
    <div class="par">
      <div class="un"><div class="n">${nf(DADOS.doacoes.entradas)}</div><div class="r">entradas no mês</div></div>
      <div class="un"><div class="n laranja">${nf(DADOS.doacoes.saidas)}</div><div class="r">distribuições</div></div>
    </div>
    <div class="apoio" style="margin-top:3vh">Tudo que entra tem doador registrado.
      Tudo que sai tem destinatário e responsável.</div>`
];

/* Slides de presença: mais tempo no ar, porque é o dado que muda. */
const AO_VIVO = [0, 1];
const TEMPO = i => AO_VIVO.includes(i) ? 11000 : 9000;

let atual = 0, relogioSlide = null;
const palco = document.getElementById('palco');
const pontos = document.getElementById('pontos');
document.getElementById('inst').textContent = DADOS.instituicao;

palco.innerHTML = SLIDES.map((f,i) => `<div class="slide" id="sl${i}"></div>`).join('');
pontos.innerHTML = SLIDES.map((_,i) => `<i id="pt${i}"></i>`).join('');

function mostrar(i){
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.pontos i').forEach(p => p.classList.remove('on'));
  const el = document.getElementById('sl'+i);
  el.innerHTML = SLIDES[i]();
  el.classList.add('on');
  document.getElementById('pt'+i).classList.add('on');
  clearTimeout(relogioSlide);
  relogioSlide = setTimeout(proximo, TEMPO(i));
}
function proximo(){ atual = (atual + 1) % SLIDES.length; mostrar(atual); }
function anterior(){ atual = (atual - 1 + SLIDES.length) % SLIDES.length; mostrar(atual); }

mostrar(0);

/* Enquanto um slide de presença estiver no ar, o número se corrige sozinho.
   Quando isto falar com o banco, é aqui que a consulta entra. */
function atualizarPresenca(){
  /* DEMONSTRAÇÃO: oscila levemente para mostrar que o número é vivo.
     Em produção, substituir por uma leitura de /presenca/agora. */
  DADOS.presenca.locais.forEach(l => {
    const d = Math.round((Math.random() - .45) * 3);
    l.dentro = Math.max(0, Math.min(l.capacidade || 999, l.dentro + d));
  });
  if(AO_VIVO.includes(atual)){
    const el = document.getElementById('sl'+atual);
    el.innerHTML = SLIDES[atual]();
  }
}
setInterval(atualizarPresenca, 15000);

function relogio(){
  const d = new Date();
  document.getElementById('agora').textContent =
    d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' })
      .replace(/^./, c => c.toUpperCase()) + ' · ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
relogio(); setInterval(relogio, 20000);

/* setas e toque, para quem quiser conduzir na mão */
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') proximo();
  if(e.key === 'ArrowLeft') anterior();
});
palco.addEventListener('click', proximo);
</script>
</body>
</html>
